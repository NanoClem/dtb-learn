version: "3.8"

services:
    db:
        image: postgres:14.17
        container_name: postgres-container
        restart: unless-stopped
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_DB=instacart
        healthcheck:
            test: ["CMD-SHELL", "pg_isready"]
            interval: 1s
            timeout: 5s
            retries: 10
        ports:
          - 5432:5432
        volumes:
            - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: